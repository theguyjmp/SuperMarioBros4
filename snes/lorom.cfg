SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    BSS:      load = LORAM, type = bss, define = yes;
    HIBSS:    load = HIRAM, type = bss, define = yes, optional = yes;
    EXBSS:    load = EXRAM, type = bss, define = yes, optional = yes;
    CODE:     load = ROM00, type = ro;
    RODATA:   load = ROM00, type = ro;
    HEADER:   load = ROM00, type = ro, start = $80FFC0;
    VECTORS:  load = ROM00, type = ro, start = $80FFE0;
    # engine code overflow / module banks (each module picks its own bank segment; see DESIGN.md)
    CODE1:    load = ROM01, type = ro, optional = yes;   # engine
    CODE2:    load = ROM02, type = ro, optional = yes;   # engine / entities
    CODE3:    load = ROM03, type = ro, optional = yes;   # entities
    CODE4:    load = ROM04, type = ro, optional = yes;   # sprites module
    CODE5:    load = ROM05, type = ro, optional = yes;   # backgrounds module
    CODE6:    load = ROM06, type = ro, optional = yes;   # sound module (driver blob + samples may spill to DATAHI)
    CODE7:    load = ROM07, type = ro, optional = yes;   # screens (title/map/menus)
    DATA8:    load = ROM08, type = ro, optional = yes;
    DATA9:    load = ROM09, type = ro, optional = yes;
