# LoROM, FastROM (banks $80-$BF), 2 MB. Segments: CODE* = code banks, DATA8-15 and BANK16-63 = data banks (one 32 KB bank each;
# a LoROM bank is only $8000-$FFFF, so never let one blob cross a bank: put large data in its own BANKnn segment).
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    LORAM:  start = $0100, size = $1D00, type = rw, define = yes;   # $0100-$1DFF (stack at $1FFF grows down to $1E00)
    HIRAM:  start = $7E2000, size = $E000, type = rw, define = yes;
    EXRAM:  start = $7F0000, size = $10000, type = rw, define = yes;
    ROM00:  start = $808000, size = $8000, fill = yes, fillval = $FF;
    ROM01:  start = $818000, size = $8000, fill = yes, fillval = $FF;
    ROM02:  start = $828000, size = $8000, fill = yes, fillval = $FF;
    ROM03:  start = $838000, size = $8000, fill = yes, fillval = $FF;
    ROM04:  start = $848000, size = $8000, fill = yes, fillval = $FF;
    ROM05:  start = $858000, size = $8000, fill = yes, fillval = $FF;
    ROM06:  start = $868000, size = $8000, fill = yes, fillval = $FF;
    ROM07:  start = $878000, size = $8000, fill = yes, fillval = $FF;
    ROM08:  start = $888000, size = $8000, fill = yes, fillval = $FF;
