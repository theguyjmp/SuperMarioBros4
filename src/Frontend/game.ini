# Identity of the game the player exe runs. build.ps1 embeds this file (-GameIni picks another one);
# a game.ini next to the exe overrides any key at runtime. Nothing else in src/Frontend is game-specific.
Title=Super Mario Bros. 4
# %APPDATA%\<AppFolder> holds player-settings.ini, the save file, save states, player.log
AppFolder=SuperMarioBros4
# a ROM with this name next to the exe replaces the embedded one
RomFile=SuperMarioBros4.sfc
# battery save (SNES SRAM), written whenever the game changes it and on exit
SaveFile=save.srm
# libretro core, looked up in <exe dir>\cores, <exe dir>, then any parent's bin\cores
Core=bsnes_libretro.dll
# F12 screenshots go to Pictures\<ScreenshotFolder>\<ScreenshotPrefix>_<time>.png
ScreenshotFolder=Super Mario Bros 4
ScreenshotPrefix=smb4
# CoreOption.<key>=<value> forces a core option (defaults otherwise; users can change them in Options > Emulator core)
